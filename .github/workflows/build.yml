name: Build Sapp APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Sapp bundle
        run: |
          python3 - <<'PY'
          import re
          import os
          import base64

          bundle = "bundle-4-Sapp-fixed.txt"

          if not os.path.isfile(bundle):
              raise SystemExit(f"ERROR: {bundle} was not found")

          text = open(bundle, encoding="utf-8").read()

          parts = re.split(
              r'^=====(FILE|B64) (.+?)=====\n',
              text,
              flags=re.MULTILINE
          )

          if len(parts) < 4:
              raise SystemExit("ERROR: Invalid bundle format")

          count = 0

          for i in range(1, len(parts), 3):
              kind = parts[i]
              path = parts[i + 1]
              body = parts[i + 2]

              os.makedirs(
                  os.path.dirname(path) or ".",
                  exist_ok=True
              )

              if kind == "B64":
                  with open(path, "wb") as f:
                      f.write(base64.b64decode(body))
              else:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(body)

              count += 1
              print(f"Extracted: {path}")

          print(f"Successfully extracted {count} files.")

          if not os.path.isfile("settings.gradle"):
              raise SystemExit("ERROR: settings.gradle missing")

          if not os.path.isfile("app/build.gradle"):
              raise SystemExit("ERROR: app/build.gradle missing")

          if not os.path.isfile("app/src/main/AndroidManifest.xml"):
              raise SystemExit("ERROR: AndroidManifest.xml missing")

          if not os.path.isfile("app/planner.jks"):
              raise SystemExit("ERROR: planner.jks missing")

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show project configuration
        run: |
          echo "===== Gradle ====="
          gradle --version

          echo "===== Project ====="
          find . -maxdepth 4 -type f | sort

          echo "===== app/build.gradle ====="
          cat app/build.gradle

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Build Sapp debug APK
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --info \
            --warning-mode all \
            --no-daemon

      - name: Check APK
        run: |
          echo "===== APK OUTPUT ====="
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload Sapp APK
        uses: actions/upload-artifact@v4
        with:
          name: Sapp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
